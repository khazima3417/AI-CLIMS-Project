<!DOCTYPE html>
<html lang="scores">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🦖 Dino Runner</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #1a1a2e;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    touch-action: manipulation;
    user-select: none;
  }
  #wrap {
    display: flex; flex-direction: column; align-items: center;
    width: 100%; max-width: 900px; padding: 10px;
  }
  #hud {
    width: 100%; display: flex; justify-content: space-between;
    color: #eee; font-size: 16px; padding: 4px 6px; letter-spacing: 1px;
  }
  #gameCanvas {
    width: 100%; height: auto;
    background: linear-gradient(#87CEEB 0%, #cfe9f7 70%, #e8d9b5 70%, #d8c69a 100%);
    border: 3px solid #333;
    border-radius: 8px;
    display: block;
    touch-action: manipulation;
  }
  #msg {
    position: relative;
    margin-top: -70px;
    color: #222;
    font-weight: bold;
    text-align: center;
    font-size: 18px;
    pointer-events: none;
    text-shadow: 0 1px 2px rgba(255,255,255,0.6);
  }
  #hint {
    color: #aaa; font-size: 12px; margin-top: 8px; text-align: center;
  }
</style>
</head>
<body><a href="index.html" style="position:fixed;top:12px;left:12px;z-index:9999;background:rgba(0,0,0,0.55);color:#fff;text-decoration:none;font-family:sans-serif;font-size:13px;padding:7px 12px;border-radius:20px;border:1px solid rgba(255,255,255,0.25);backdrop-filter:blur(4px);">← Home</a>
<div id="wrap">
  <div id="hud">
    <span>SCORE: <span id="score">0</span></span>
    <span>HI: <span id="hiscore">0</span></span>
  </div>
  <canvas id="gameCanvas" width="900" height="300"></canvas>
  <div id="msg"></div>
  <div id="hint">Jump: SPACE / ↑ / TAP screen</div>
</div>

<script>
(function(){
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const GROUND_Y = H - 40;

  const scoreEl = document.getElementById('score');
  const hiEl = document.getElementById('hiscore');
  const msgEl = document.getElementById('msg');

  // ---------- High score storage (with safe fallback) ----------
  let memoryHigh = 0;
  function storageAvailable(){
    try {
      const t = '__t__';
      localStorage.setItem(t,t);
      localStorage.removeItem(t);
      return true;
    } catch(e){ return false; }
  }
  const canUseStorage = storageAvailable();
  function getHighScore(){
    if (canUseStorage) {
      return parseInt(localStorage.getItem('dinoHighScore') || '0', 10);
    }
    return memoryHigh;
  }
  function setHighScore(val){
    if (canUseStorage) {
      localStorage.setItem('dinoHighScore', String(val));
    } else {
      memoryHigh = val;
    }
  }

  let highScore = getHighScore();
  hiEl.textContent = highScore;

  // ---------- Audio (jump sound, no external files) ----------
  let audioCtx = null;
  function playJumpSound(){
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'square';
      o.frequency.setValueAtTime(340, audioCtx.currentTime);
      o.frequency.exponentialRampToValueAtTime(620, audioCtx.currentTime + 0.08);
      g.gain.setValueAtTime(0.15, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
      o.connect(g); g.connect(audioCtx.destination);
      o.start();
      o.stop(audioCtx.currentTime + 0.16);
    } catch(e) { /* audio not available, ignore */ }
  }
  function playGameOverSound(){
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(220, audioCtx.currentTime);
      o.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.35);
      g.gain.setValueAtTime(0.18, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
      o.connect(g); g.connect(audioCtx.destination);
      o.start();
      o.stop(audioCtx.currentTime + 0.4);
    } catch(e) {}
  }

  // ---------- Game state ----------
  let speed = 4.2;
  const baseSpeed = 4.2;
  const maxSpeed = 15;
  let score = 0;
  let running = false;
  let gameOver = false;
  let frame = 0;

  const dino = {
    x: 60, y: GROUND_Y - 44, w: 40, h: 44,
    vy: 0, jumping: false, legFrame: 0
  };
  const GRAVITY = 0.85;
  const JUMP_VELOCITY = -15.5;

  let obstacles = [];
  let clouds = [];
  let groundDashes = [];

  function initClouds(){
    clouds = [];
    for (let i=0;i<5;i++){
      clouds.push({
        x: Math.random()*W,
        y: 15 + Math.random()*75,
        s: 1.1 + Math.random()*1.1,
        flip: Math.random() < 0.5
      });
    }
  }
  function initGround(){
    groundDashes = [];
    for (let i=0;i<30;i++){
      groundDashes.push(i * 30);
    }
  }

  function resetGame(){
    speed = baseSpeed;
    score = 0;
    obstacles = [];
    dino.y = GROUND_Y - dino.h;
    dino.vy = 0;
    dino.jumping = false;
    frame = 0;
    gameOver = false;
    initClouds();
    initGround();
    msgEl.textContent = '';
  }

  function spawnObstacle(){
    const types = ['cactus_small','cactus_big','cactus_cluster','tree'];
    const type = types[Math.floor(Math.random()*types.length)];
    let w,h;
    if (type === 'cactus_small'){ w=18; h=32; }
    else if (type === 'cactus_big'){ w=24; h=46; }
    else if (type === 'cactus_cluster'){ w=42; h=36; }
    else { w=30; h=54; }
    obstacles.push({ x: W + 20, y: GROUND_Y - h, w, h, type, passed:false });
  }

  // ---------- Drawing ----------
  function drawGround(){
    ctx.strokeStyle = '#5a4632';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    ctx.lineTo(W, GROUND_Y);
    ctx.stroke();

    ctx.strokeStyle = '#8a7654';
    ctx.lineWidth = 2;
    for (let d of groundDashes){
      ctx.beginPath();
      ctx.moveTo(d, GROUND_Y + 6);
      ctx.lineTo(d + 14, GROUND_Y + 6);
      ctx.stroke();
    }
  }

  function drawCloud(c){
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.scale(c.s * 0.42 * (c.flip ? -1 : 1), c.s);
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.strokeStyle = 'rgba(150,175,190,0.35)';
    ctx.lineWidth = 1.2 / c.s;

    // single continuous scalloped cloud outline (bezier bumps),
    // drawn on a local 0-100 x 0-70 grid, centered roughly on origin
    const ox = -47, oy = -33;
    ctx.beginPath();
    ctx.moveTo(ox+5, oy+45);
    // left bump rising
    ctx.quadraticCurveTo(ox+2, oy+25, ox+15, oy+22);
    // up into main top hump
    ctx.quadraticCurveTo(ox+20, oy+2, ox+45, oy+0);
    ctx.quadraticCurveTo(ox+65, oy+2, ox+70, oy+18);
    // right shoulder into big right bump
    ctx.quadraticCurveTo(ox+78, oy+22, ox+85, oy+30);
    ctx.quadraticCurveTo(ox+95, oy+38, ox+90, oy+50);
    ctx.quadraticCurveTo(ox+85, oy+58, ox+75, oy+55);
    // bottom scallop back toward left
    ctx.quadraticCurveTo(ox+65, oy+65, ox+50, oy+58);
    ctx.quadraticCurveTo(ox+35, oy+65, ox+22, oy+55);
    ctx.quadraticCurveTo(ox+10, oy+58, ox+5, oy+45);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.restore();
  }

  function drawDino(){
    const {x,y,w,h} = dino;
    const bodyColor = '#2e5339';
    const darkColor = '#1f3d28';

    ctx.save();

    // slight bob while running, none while jumping
    const bob = dino.jumping ? 0 : Math.sin(dino.legFrame/5) * 1.5;

    // tail (curved, tapering)
    ctx.fillStyle = bodyColor;
    ctx.beginPath();
    ctx.moveTo(x+10, y+16+bob);
    ctx.quadraticCurveTo(x-6, y+14+bob, x-14, y+6+bob);
    ctx.quadraticCurveTo(x-4, y+20+bob, x+10, y+24+bob);
    ctx.closePath();
    ctx.fill();

    // body (curved back, rounded belly)
    ctx.beginPath();
    ctx.moveTo(x+10, y+30+bob);
    ctx.quadraticCurveTo(x+8, y+10+bob, x+22, y+6+bob);
    ctx.quadraticCurveTo(x+w-6, y+2+bob, x+w-4, y+18+bob);
    ctx.quadraticCurveTo(x+w-2, y+30+bob, x+w-14, y+32+bob);
    ctx.quadraticCurveTo(x+18, y+34+bob, x+10, y+30+bob);
    ctx.closePath();
    ctx.fill();

    // head (rounded with snout)
    ctx.beginPath();
    ctx.moveTo(x+w-16, y+2+bob);
    ctx.quadraticCurveTo(x+w-2, y-2+bob, x+w+4, y+8+bob);
    ctx.quadraticCurveTo(x+w+2, y+16+bob, x+w-8, y+18+bob);
    ctx.quadraticCurveTo(x+w-20, y+16+bob, x+w-18, y+4+bob);
    ctx.closePath();
    ctx.fill();

    // jaw line
    ctx.fillStyle = darkColor;
    ctx.fillRect(x+w-6, y+13+bob, 10, 3);

    // eye
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(x+w-6, y+7+bob, 3, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(x+w-5, y+7+bob, 1.3, 0, Math.PI*2);
    ctx.fill();

    // tiny arm
    ctx.fillStyle = bodyColor;
    ctx.fillRect(x+w-16, y+20+bob, 8, 4);

    // legs (animated run cycle)
    ctx.fillStyle = darkColor;
    if (dino.jumping){
      // tucked legs mid-air
      ctx.fillRect(x+12, y+h-12, 7, 10);
      ctx.fillRect(x+w-16, y+h-12, 7, 10);
    } else {
      const cycle = (dino.legFrame % 20) / 20;
      const swing = Math.sin(cycle * Math.PI * 2);
      const legFrontLen = 14 + swing * 5;
      const legBackLen = 14 - swing * 5;
      // back leg
      ctx.fillRect(x+11, y+h-14, 7, legBackLen);
      // front leg
      ctx.fillRect(x+w-17, y+h-14, 7, legFrontLen);
      // feet
      ctx.fillRect(x+9, y+h-14+legBackLen-3, 11, 3);
      ctx.fillRect(x+w-19, y+h-14+legFrontLen-3, 11, 3);
    }

    ctx.restore();
  }

  function drawCactus(o){
    ctx.fillStyle = '#2f7a3d';
    if (o.type === 'cactus_small'){
      ctx.fillRect(o.x + o.w/2 - 4, o.y, 8, o.h);
      ctx.fillRect(o.x, o.y + 10, 8, 6);
      ctx.fillRect(o.x + o.w - 8, o.y + 16, 8, 6);
    } else if (o.type === 'cactus_big'){
      ctx.fillRect(o.x + o.w/2 - 5, o.y, 10, o.h);
      ctx.fillRect(o.x-2, o.y + 12, 10, 7);
      ctx.fillRect(o.x + o.w - 8, o.y + 20, 10, 7);
    } else { // cluster
      ctx.fillRect(o.x, o.y + 6, 8, o.h - 6);
      ctx.fillRect(o.x + 14, o.y, 8, o.h);
      ctx.fillRect(o.x + 30, o.y + 8, 8, o.h - 8);
    }
  }

  function drawTree(o){
    ctx.fillStyle = '#6b4226';
    ctx.fillRect(o.x + o.w/2 - 4, o.y + o.h - 26, 8, 26);
    ctx.fillStyle = '#2e6b3e';
    ctx.beginPath();
    ctx.moveTo(o.x + o.w/2, o.y);
    ctx.lineTo(o.x, o.y + 30);
    ctx.lineTo(o.x + o.w, o.y + 30);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(o.x + o.w/2, o.y + 12);
    ctx.lineTo(o.x + 3, o.y + 40);
    ctx.lineTo(o.x + o.w - 3, o.y + 40);
    ctx.closePath();
    ctx.fill();
  }

  function drawObstacle(o){
    if (o.type === 'tree') drawTree(o);
    else drawCactus(o);
  }

  // ---------- Collision ----------
  function collides(a,b){
    const pad = 6;
    return a.x + pad < b.x + b.w &&
           a.x + a.w - pad > b.x &&
           a.y + pad < b.y + b.h &&
           a.y + a.h - pad > b.y;
  }

  // ---------- Main loop ----------
  function update(){
    frame++;

    // clouds
    for (let c of clouds){
      c.x -= 0.5 * c.s;
      if (c.x < -60){
        c.x = W + 40;
        c.y = 15 + Math.random()*75;
        c.s = 1.1 + Math.random()*1.1;
        c.flip = Math.random() < 0.5;
      }
    }

    // ground dashes
    for (let i=0;i<groundDashes.length;i++){
      groundDashes[i] -= speed;
      if (groundDashes[i] < -20) groundDashes[i] += W + 20;
    }

    // dino physics
    if (dino.jumping){
      dino.vy += GRAVITY;
      dino.y += dino.vy;
      if (dino.y >= GROUND_Y - dino.h){
        dino.y = GROUND_Y - dino.h;
        dino.jumping = false;
        dino.vy = 0;
      }
    } else {
      dino.legFrame++;
    }

    // obstacles
    if (frame % Math.max(45, Math.floor(90 - speed*3)) === 0){
      spawnObstacle();
    }
    for (let o of obstacles){
      o.x -= speed;
    }
    obstacles = obstacles.filter(o => o.x + o.w > -10);

    // scoring + collision
    for (let o of obstacles){
      if (!o.passed && o.x + o.w < dino.x){
        o.passed = true;
        score += 10;
      }
      if (collides(dino, o)){
        endGame();
      }
    }

    // difficulty ramp: slow start, then accelerates as score grows
    score += 0.1;
    const growth = Math.pow(score / 100, 1.4) * 0.9;
    speed = Math.min(maxSpeed, baseSpeed + growth);

    scoreEl.textContent = Math.floor(score);
  }

  function render(){
    ctx.clearRect(0,0,W,H);
    for (let c of clouds) drawCloud(c);
    drawGround();
    for (let o of obstacles) drawObstacle(o);
    drawDino();
  }

  function loop(){
    if (running && !gameOver){
      update();
    }
    render();
    if (!gameOver){
      requestAnimationFrame(loop);
    }
  }

  function jump(){
    if (gameOver){
      startGame();
      return;
    }
    if (!running){
      startGame();
      return;
    }
    if (!dino.jumping){
      dino.jumping = true;
      dino.vy = JUMP_VELOCITY;
      playJumpSound();
    }
  }

  function startGame(){
    resetGame();
    running = true;
    gameOver = false;
    loop();
  }

  function endGame(){
    gameOver = true;
    running = false;
    playGameOverSound();
    const finalScore = Math.floor(score);
    if (finalScore > highScore){
      highScore = finalScore;
      setHighScore(highScore);
      hiEl.textContent = highScore;
      msgEl.textContent = '🏆 NEW HIGH SCORE! ' + finalScore + ' — tap / press SPACE to restart';
    } else {
      msgEl.textContent = 'GAME OVER — Score: ' + finalScore + ' — tap / press SPACE to restart';
    }
    render();
  }

  // ---------- Input ----------
  window.addEventListener('keydown', function(e){
    if (e.code === 'Space' || e.code === 'ArrowUp'){
      e.preventDefault();
      jump();
    }
  });
  canvas.addEventListener('touchstart', function(e){
    e.preventDefault();
    jump();
  }, {passive:false});
  canvas.addEventListener('mousedown', function(e){
    jump();
  });

  // ---------- Init ----------
  resetGame();
  msgEl.textContent = 'Press SPACE / TAP to start';
  render();

  if (!canUseStorage){
    console.warn('localStorage not available in this environment — using in-memory high score for this session only.');
  }
})();
</script>
</body>
</html>
