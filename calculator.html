<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scientific Calculator</title>
<style>
  :root {
    --body-bg: #1b1d1a;
    --case-bg: #26281f;
    --case-edge: #34362a;
    --lcd-bg: #c9d4b8;
    --lcd-ink: #23291d;
    --lcd-ink-dim: #6b7460;
    --key-fn: #3a3d31;
    --key-fn-text: #cfd3c1;
    --key-num: #45483a;
    --key-num-text: #f2f1e6;
    --key-op: #b97a3d;
    --key-op-text: #1b1d1a;
    --key-eq: #7fa06b;
    --key-eq-text: #1b1d1a;
    --accent: #e0a640;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--body-bg);
    font-family: 'Courier New', ui-monospace, monospace;
    padding: 24px;
  }

  .device {
    width: 380px;
    max-width: 100%;
    background: linear-gradient(160deg, var(--case-edge), var(--case-bg) 40%);
    border-radius: 22px;
    padding: 18px 18px 22px;
    box-shadow:
      0 30px 60px -20px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(255,255,255,0.04);
    border: 1px solid rgba(0,0,0,0.4);
  }

  .brand-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 2px 6px 12px;
    color: var(--key-fn-text);
  }
  .brand {
    font-size: 13px;
    letter-spacing: 3px;
    font-weight: bold;
    opacity: 0.85;
  }
  .model {
    font-size: 10px;
    letter-spacing: 1px;
    opacity: 0.5;
  }

  .screen {
    background: var(--lcd-bg);
    border-radius: 10px;
    padding: 14px 16px 10px;
    box-shadow: inset 0 3px 10px rgba(0,0,0,0.35);
    position: relative;
    overflow: hidden;
  }
  .screen::after {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0.025),
      rgba(0,0,0,0.025) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
  }

  .status-row {
    display: flex;
    gap: 10px;
    font-size: 10px;
    letter-spacing: 1.5px;
    color: var(--lcd-ink-dim);
    height: 14px;
    margin-bottom: 2px;
  }
  .status-row span { opacity: 0.35; transition: opacity .15s; }
  .status-row span.active { opacity: 1; color: var(--lcd-ink); }

  .expr {
    min-height: 18px;
    text-align: right;
    font-size: 13px;
    color: var(--lcd-ink-dim);
    white-space: nowrap;
    overflow-x: auto;
    letter-spacing: 0.5px;
  }
  .expr::-webkit-scrollbar { display: none; }

  .result {
    text-align: right;
    font-size: 34px;
    color: var(--lcd-ink);
    font-weight: bold;
    letter-spacing: 1px;
    min-height: 42px;
    overflow-x: auto;
    white-space: nowrap;
  }
  .result::-webkit-scrollbar { display: none; }

  .keys {
    margin-top: 16px;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }

  button {
    border: none;
    border-radius: 8px;
    padding: 12px 0;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.05s ease, filter 0.15s ease;
    box-shadow: 0 2px 0 rgba(0,0,0,0.25);
  }
  button:active {
    transform: translateY(2px);
    box-shadow: 0 0 0 rgba(0,0,0,0.25);
  }

  .fn { background: var(--key-fn); color: var(--key-fn-text); }
  .num { background: var(--key-num); color: var(--key-num-text); font-size: 15px; }
  .op { background: var(--key-op); color: var(--key-op-text); font-weight: bold; }
  .eq { background: var(--key-eq); color: var(--key-eq-text); font-weight: bold; }
  .wide { grid-column: span 2; }

  button:hover { filter: brightness(1.12); }

  .mode-toggle {
    background: var(--key-fn);
    color: var(--accent);
  }
  .mode-toggle.deg-active, .mode-toggle.rad-active {
    color: var(--accent);
  }

  @media (prefers-reduced-motion: reduce) {
    button { transition: none; }
  }
</style>
</head>
<body><a href="index.html" style="position:fixed;top:12px;left:12px;z-index:9999;background:rgba(0,0,0,0.55);color:#fff;text-decoration:none;font-family:sans-serif;font-size:13px;padding:7px 12px;border-radius:20px;border:1px solid rgba(255,255,255,0.25);backdrop-filter:blur(4px);">← Home</a>

<div class="device">
  <div class="brand-row">
    <span class="brand">SCI·41</span>
    <span class="model">fx-model / dual angle</span>
  </div>

  <div class="screen">
    <div class="status-row">
      <span id="deg-ind" class="active">DEG</span>
      <span id="rad-ind">RAD</span>
      <span id="err-ind" style="margin-left:auto;">E</span>
    </div>
    <div class="expr" id="expr"></div>
    <div class="result" id="result">0</div>
  </div>

  <div class="keys" id="keys"></div>
</div>

<script>
(function() {
  const exprEl = document.getElementById('expr');
  const resultEl = document.getElementById('result');
  const degInd = document.getElementById('deg-ind');
  const radInd = document.getElementById('rad-ind');
  const errInd = document.getElementById('err-ind');
  const keysEl = document.getElementById('keys');

  let expr = "";
  let isDeg = true;
  let justEvaluated = false;

  const layout = [
    { label: "deg", cls: "fn mode-toggle", action: "mode" },
    { label: "(", cls: "fn", action: "char", value: "(" },
    { label: ")", cls: "fn", action: "char", value: ")" },
    { label: "⌫", cls: "fn", action: "back" },
    { label: "AC", cls: "fn", action: "clear" },

    { label: "sin", cls: "fn", action: "func", value: "sin" },
    { label: "cos", cls: "fn", action: "func", value: "cos" },
    { label: "tan", cls: "fn", action: "func", value: "tan" },
    { label: "ln", cls: "fn", action: "func", value: "ln" },
    { label: "log", cls: "fn", action: "func", value: "log" },

    { label: "x²", cls: "fn", action: "postfix", value: "^2" },
    { label: "xʸ", cls: "fn", action: "char", value: "^" },
    { label: "√", cls: "fn", action: "func", value: "sqrt" },
    { label: "n!", cls: "fn", action: "postfix", value: "!" },
    { label: "π", cls: "fn", action: "char", value: "π" },

    { label: "7", cls: "num", action: "char", value: "7" },
    { label: "8", cls: "num", action: "char", value: "8" },
    { label: "9", cls: "num", action: "char", value: "9" },
    { label: "÷", cls: "op", action: "char", value: "÷" },
    { label: "e", cls: "fn", action: "char", value: "e" },

    { label: "4", cls: "num", action: "char", value: "4" },
    { label: "5", cls: "num", action: "char", value: "5" },
    { label: "6", cls: "num", action: "char", value: "6" },
    { label: "×", cls: "op", action: "char", value: "×" },
    { label: "%", cls: "fn", action: "char", value: "%" },

    { label: "1", cls: "num", action: "char", value: "1" },
    { label: "2", cls: "num", action: "char", value: "2" },
    { label: "3", cls: "num", action: "char", value: "3" },
    { label: "−", cls: "op", action: "char", value: "-" },
    { label: "1/x", cls: "fn", action: "wrap", value: "1/(", close: ")" },

    { label: "0", cls: "num wide", action: "char", value: "0" },
    { label: ".", cls: "num", action: "char", value: "." },
    { label: "+", cls: "op", action: "char", value: "+" },
    { label: "=", cls: "eq", action: "equals" },
  ];

  layout.forEach(k => {
    const btn = document.createElement('button');
    btn.textContent = k.label;
    btn.className = k.cls;
    btn.addEventListener('click', () => handle(k));
    keysEl.appendChild(btn);
  });

  function handle(k) {
    errInd.classList.remove('active');
    if (justEvaluated && (k.action === 'char' || k.action === 'func' || k.action === 'wrap')) {
      expr = "";
      justEvaluated = false;
    }
    switch (k.action) {
      case 'mode':
        isDeg = !isDeg;
        degInd.classList.toggle('active', isDeg);
        radInd.classList.toggle('active', !isDeg);
        break;
      case 'char':
        expr += k.value;
        break;
      case 'func':
        expr += k.value + "(";
        break;
      case 'postfix':
        expr += k.value;
        break;
      case 'wrap':
        expr += k.value;
        break;
      case 'back':
        expr = expr.slice(0, -1);
        break;
      case 'clear':
        expr = "";
        resultEl.textContent = "0";
        justEvaluated = false;
        break;
      case 'equals':
        evaluate();
        justEvaluated = true;
        break;
    }
    exprEl.textContent = expr;
    if (k.action !== 'equals' && k.action !== 'clear') {
      resultEl.textContent = livePreview();
    }
  }

  function toEvalString(str) {
    let s = str;
    s = s.replace(/÷/g, "/").replace(/×/g, "*").replace(/π/g, "PI").replace(/−/g, "-");
    // n! factorial handling: replace "<number>!" with factorial(<number>)
    s = s.replace(/(\d+(\.\d+)?)!/g, "factorial($1)");
    // ^ to ** for power
    s = s.replace(/\^/g, "**");
    return s;
  }

  function factorial(n) {
    n = Math.round(n);
    if (n < 0) return NaN;
    let r = 1;
    for (let i = 2; i <= n; i++) r *= i;
    return r;
  }

  function buildScope() {
    const toRad = (x) => isDeg ? x * Math.PI / 180 : x;
    return {
      PI: Math.PI,
      e: Math.E,
      sin: (x) => Math.sin(toRad(x)),
      cos: (x) => Math.cos(toRad(x)),
      tan: (x) => Math.tan(toRad(x)),
      ln: (x) => Math.log(x),
      log: (x) => Math.log10(x),
      sqrt: (x) => Math.sqrt(x),
      factorial: factorial,
    };
  }

  function safeEval(str) {
    const scope = buildScope();
    const evalStr = toEvalString(str);
    const argNames = Object.keys(scope);
    const argValues = Object.values(scope);
    // eslint-disable-next-line no-new-func
    const fn = new Function(...argNames, "return (" + evalStr + ")");
    const val = fn(...argValues);
    if (typeof val !== 'number' || !isFinite(val)) throw new Error("bad result");
    return val;
  }

  function formatNumber(n) {
    if (Number.isInteger(n)) return n.toString();
    return parseFloat(n.toFixed(10)).toString();
  }

  function livePreview() {
    if (expr.trim() === "") return "0";
    try {
      const val = safeEval(expr);
      return formatNumber(val);
    } catch (e) {
      return resultEl.textContent;
    }
  }

  function evaluate() {
    if (expr.trim() === "") return;
    try {
      const val = safeEval(expr);
      resultEl.textContent = formatNumber(val);
    } catch (e) {
      resultEl.textContent = "Error";
      errInd.classList.add('active');
    }
  }

  // keyboard support
  window.addEventListener('keydown', (e) => {
    const map = {
      'Enter': () => handle({ action: 'equals' }),
      'Backspace': () => handle({ action: 'back' }),
      'Escape': () => handle({ action: 'clear' }),
      '*': () => handle({ action: 'char', value: '×' }),
      '/': () => handle({ action: 'char', value: '÷' }),
    };
    if (map[e.key]) { e.preventDefault(); map[e.key](); return; }
    if (/^[0-9.+\-()%]$/.test(e.key)) {
      handle({ action: 'char', value: e.key });
    }
  });
})();
</script>

</body>
</html>
